<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <link rel="manifest" href="./manifest.webmanifest">
  <title>Cognitive Assessment v1.0</title>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>

</head>
<body>
  <noscript>Bài test cần JavaScript để hoạt động.</noscript>
  <div id="app-shell">
    <div id="statusbar">
      <div>
        <div class="eyebrow">COGNITIVE ASSESSMENT</div>
        <div id="phase-label">Khởi động</div>
      </div>
      <div id="progress-label">0%</div>
    </div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="jspsych-target"></div>
  </div>
  <script src="./app.js"></script>\n  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body>
</html>
